# Site values for install-bundle.sh --site. KEY=VALUE, no shell expansion; every key is optional.
# Partition and account for every task job (a policy row can move single tasks elsewhere):
SLURM_PARTITION=core
SLURM_ACCOUNT=<account>
# GPU tasks (config.json deepvariant = gpu or parabricks): their partition (and account when it differs),
# and --nv for Apptainer so the containers see the GPUs. Empty and 0 on a cluster without GPUs.
SLURM_PARTITION_GPU=gpu
SLURM_ACCOUNT_GPU=
SINGULARITY_NV=1
# Other sbatch arguments (qos, reservation, ...); never --partition or --account here:
SLURM_EXTRA_ARGS=
# Caps from the node shape of the partition; 0 = none. 375G is a 384000 MB node.
TASK_CPU_MAX=48
TASK_MEMORY_MAX=375G
# SLURM jobs one miniwdl process keeps in flight (total = this x ugc-wgw --max-inflight):
TASK_CONCURRENCY=50
# wall time in minutes for tasks that set none (3 days):
TASK_TIME_MINUTES=4320
# shared across installed versions; <prefix> is replaced by the install root:
CALL_CACHE_DIR=<prefix>/call_cache
# the per-task resource policy, chapter 12:
TASK_RESOURCES=<prefix>/resources.tsv
