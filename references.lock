    "ugc-wgw-tr": {
      "version": "0.2.0",
      "source": "this repository (references/): two tables generated by scripts/make-strchive-map.py from STRchive v2.4.4 and the TRGT catalog of the reference data container",
      "files": [
        {
          "name": "tr_disease_loci.strchive-2.4.4.tsv",
          "sha256": "ffba3a923ef1128f2cd4071753454007de7cbd233fff2ae0e252c554f2eb462d",
          "bytes": 15406,
          "url": "https://raw.githubusercontent.com/dashnowlab/STRchive/refs/tags/v2.4.4/data/STRchive-loci.json"
        },
        {
          "name": "tr_named_overlaps.tsv",
          "sha256": "f42084b1438f906fd08392c6fb70e36b269e40897b14db41246d88b89b5b9895",
          "bytes": 3732
        }
      ],
      "install_subdir": "ugc-wgw-tr-0.2.0",
      "notes": "References of the cohort_tr stage (0.18.0; no image of ours). tr_disease_loci.strchive-2.4.4.tsv: the 73 named disease loci of the TRGT catalog (GRCh38_GIABv3/trgt/adotto_strchive_20250827.hg38.bed.gz, which upstream built from STRchive v2.4.4's TRGT BED and the Adotto catalog) joined by locus id with STRchive v2.4.4's data/STRchive-loci.json (326,452 bytes, sha256 bbfe8823…55530; STRchive, https://strchive.org, https://github.com/dashnowlab/STRchive, licensed CC BY 4.0: the table is a derived subset and its ## header carries the attribution, the rules and both inputs' sha256): gene, disease, inheritance, the catalog's interval, motif length, STRchive's thresholds in repeat copies (benign_min/max, intermediate_min/max, pathogenic_min/max; nulls kept empty: pathogenic_min at CPEO_POLG, benign_max at SCA31_BEAN1, XDP_TAF1 and the seven FAME loci), the reference and pathogenic motifs, the catalog's motifs and the ones among them that count as pathogenic (matched on the reference strand; 72 loci exact, CJD_PRNP exact plus a rotation), frame_differs (8 loci whose TRGT interval is wider than STRchive's), the overlapping ordinary locus. Generated 2026-11-11 by scripts/make-strchive-map.py 1.0.0, which stops when the catalog's named loci and the JSON's ids differ or a benign range reaches the pathogenic one at a locus not looked at by hand (accepted: HMNR7_VWA1, pre-MIR7-2_CHNG3). tr_named_overlaps.tsv: the 62 ordinary catalog loci that overlap a named locus (ordinary_trid, named_trid, overlap_bp), the same repeat genotyped a second time under another motif or frame. Ref-map keys tr_disease_loci_tsv and tr_named_overlaps_tsv, read by ugc_wgw_cohort_tr. A newer STRchive release needs a catalog built from the same tag (the generator refuses a mismatch); cohort_tr's tr_disease_loci_override takes a table without a new lock entry. 0.2.0 (ugc-wgw 0.19.0, generator 1.1.0): two columns, assessable and assessable_note; ADTKD_MUC1 is marked not assessable by copy count (its thresholds count a cytosine tract inside one VNTR unit, not units; on the first 864-member cohort the 0.1.0 table classed 88 members pathogenic there), and cohort_tr classes nothing at such a locus. The other columns and the overlaps table's rows are those of 0.1.0."
    },
