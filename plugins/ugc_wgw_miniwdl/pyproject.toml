# ugc-wgw-miniwdl: the miniwdl task plugin that applies the site's per-task resource policy, and the
# container backend that gives tasks the node's local scratch.
# Built into a wheel by scripts/make-bundle.sh (dev machine, network for setuptools) and
# installed into the bundle's venv by scripts/install-bundle.sh (offline). Bump `version`
# whenever the plugin's code changes; the bundle version is separate.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ugc-wgw-miniwdl"
version = "0.4.0"
description = "miniwdl plugins: per-task resources from a site policy file; a SLURM backend with node-local scratch"
requires-python = ">=3.9"
dependencies = []
license = {text = "MIT"}

[project.entry-points."miniwdl.plugin.task"]
ugc_wgw_resources = "ugc_wgw_miniwdl.resources:task"

[project.entry-points."miniwdl.plugin.container_backend"]
ugc_slurm_singularity = "ugc_wgw_miniwdl.scratch:SlurmSingularityScratch"

[tool.setuptools.packages.find]
include = ["ugc_wgw_miniwdl*"]

[tool.setuptools.package-data]
ugc_wgw_miniwdl = ["scripts/*.sh"]
