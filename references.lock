      "notes": "References of the methylation layer (0.16.0: the per-sample methbat report task and the cohort_methyl stage; MethBat 1.1.0 from upstream's methbat image, no image of ours). methbat_report_regions.hg38.tsv: MethBat's data/report_regions/hg38_imprinting_targets.tsv at tag v1.1.0 unchanged (15 imprinting regions from Mackay et al. 2022, Clin Epigenetics 14:143, Table 2; GRCh38; columns chrom, start, end, cpg_label, expected_category, anomalous_categories; MethBat is BSD-3-Clause, Pacific Biosciences, redistributed with its notice); the ref-map key methbat_report_regions_tsv, read by ugc_wgw_methbat_report. methbat_map.GRCh38_GIABv3.tsv: generated 2026-11-06 by scripts/make-methbat-map.py 1.0.0 (its ## header carries the rules and every input's sha256) from the data container's CpG islands (GRCh38_GIABv3/methbat/cpgIslandExt.sorted.hg38.tsv, 32,038 islands, sha256 ae4b085c…b55050), GENCODE 50's gene rows (https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_50/gencode.v50.annotation.gtf.gz, 124,527,720 bytes, sha256 83fba3e9b03f0b8c958f3595c6c350adc55f468abf8b0e47b6d5284cfe13a453; open access; the 41,987 genes with an hgnc_id) and the imprinting regions: per island the genes whose TSS lies within 10 kb or whose body overlaps it (nearest TSS first) and region_type imprinted (19 islands) > promoter (13,811) > gene_body (10,610) > intergenic (7,598); every island keeps its row. The ref-map key methbat_map, read by ugc_wgw_methyl_summary; the join is on chrom,start,end. nanomix_39Bisulfite.methbat.tsv: MethBat's data/cell_atlas/nanomix/39Bisulfite.methbat.tsv at v1.1.0 unchanged (7,693 regions, 39 cell types; the nanomix atlases are MIT, copyright 2022 simpsonlab, build presumed hg38 by PacBio; derived from the Loyfer et al. WGBS atlas): the ref-map key methbat_atlas_tsv, read by ugc_wgw_methbat_deconvolve when run_deconvolve is on (the default since 0.20.0; MethBat's example atlas, not validated on HiFi methylation calls). A separate entry, not